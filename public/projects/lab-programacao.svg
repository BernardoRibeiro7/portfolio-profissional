  <g font-family="monospace" font-size="13"><text x="94" y="520" fill="#b9ff66">$ <tspan fill="#d8e2d9">javac Produto.java Demo.java</tspan></text><text x="94" y="550" fill="#b9ff66">$ <tspan fill="#d8e2d9">java Demo</tspan></text><text x="94" y="584" fill="#d8e2d9">Mesa: R$ 141,60</text><text x="94" y="611" fill="#d8e2d9">Imposto: R$ 21,60</text></g>
  <rect x="448" y="122" width="112" height="34" rx="8" fill="#1b281e"/><text x="504" y="144" text-anchor="middle" fill="#b9ff66" font-family="monospace" font-size="12" font-weight="700">Produto.java</text>
  <g font-family="monospace" font-size="16">
    <text x="448" y="205" fill="#91b7ff">public class <tspan fill="#dce7de">Produto {</tspan></text>
    <text x="480" y="242" fill="#91b7ff">private <tspan fill="#dce7de">String descricao;</tspan></text>
    <text x="480" y="276" fill="#91b7ff">private double <tspan fill="#dce7de">precoCusto;</tspan></text>
