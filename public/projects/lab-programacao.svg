    <text x="448" y="402" fill="#91b7ff">public double <tspan fill="#b9ff66">valorVenda</tspan><tspan fill="#dce7de">() {</tspan></text>
    <text x="480" y="436" fill="#91b7ff">return <tspan fill="#dce7de">precoCusto + margemLucro + </tspan><tspan fill="#b9ff66">valorImposto</tspan><tspan fill="#dce7de">();</tspan></text>
    <text x="448" y="470" fill="#dce7de">}</text>
    <text x="448" y="528" fill="#91b7ff">public double <tspan fill="#b9ff66">valorImposto</tspan><tspan fill="#dce7de">() {</tspan></text>
    <text x="480" y="562" fill="#91b7ff">return <tspan fill="#dce7de">(precoCusto + margemLucro)</tspan></text>
    <text x="528" y="596" fill="#dce7de">* imposto.get(categoria.toUpperCase());</text>
    <text x="448" y="630" fill="#dce7de">}</text>
